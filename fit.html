3},"e":"你要的是先被照顾，再谈事情"},{"t":"嘴上嫌你笨，手上已经把事办完了","w":{"e":3},"e":"你要的是那种不说但都在做的人"}]},{"q":"哪一种说话方式，你会心动？","o":[{"t":"话很少，但说出来的都在点上","w":{"a":3,"d":1},"e":"你信的是分量，不是数量"},{"t":"「走啊」「我带你去」，句子都很短","w":{"b":3},"e":"你喜欢那种不用铺垫的直接"},{"t":"「记得吃饭」「穿外套」，很琐碎但都是你","w":{"c":3},"e":"你的心动点在被惦记这件事本身"},{"t":"说话慢，想清楚了才说，说了就做","w":{"d":3},"e":"你要的是可信，不是好听"},{"t":"嘴上不饶人，但转头就把你说的记住了","w":{"e":3},"e":"你吃的是嘴硬手软那一套"}]},{"q":"在他面前，你最想成为什么样的人？","o":[{"t":"可以不用说话的人","w":{"a":3,"c":1},"e":"你最想要的是不用演"},{"t":"被拉着去试很多没做过的事的人","w":{"b":3},"e":"你想借他把自己打开一点"},{"t":"被照顾着、可以撒娇的人","w":{"c":3},"e":"你平时撑得太久了，想有人接一下"},{"t":"可以放心把事交出去的人","w":{"d":3},"e":"你要的是能卸下来"},{"t":"可以露出不那么乖的那一面的人","w":{"e":3,"b":1},"e":"你在别人面前太乖了，想有个地方不用乖"}]},{"q":"他带你看的第一样东西，你希望是？","o":[{"t":"他正在看的书或者歌，递过来让你听","w":{"a":3},"e":"你要的是进到他的世界里去"},{"t":"一条你没走过的路，说「跟着我」","w":{"b":3},"e":"你要的是被带着走"},{"t":"他做的一桌子菜，说「尝尝」","w":{"c":3},"e":"你要的是被喂"},{"t":"他安排好的一整个周末，什么都不用你想","w":{"d":3,"c":1},"e":"你要的是可以不用操心"},{"t":"一条夜里才走的路线，那个地方只有你们两个知道","w":{"e":3},"e":"你要的是只属于你们两个的秘密"}]},{"q":"下面这句话，你最想听哪一句？","o":[{"t":"「我记着呢。」","w":{"a":3,"c":1},"e":"你最想要的不是惊喜，是没被忘掉"},{"t":"「走，我带你去。」","w":{"b":3},"e":"你要的是有人替你迈出第一步"},{"t":"「给你留了。」","w":{"c":3},"e":"「留」这个字里有人一直想着你"},{"t":"「有我在。」","w":{"d":3},"e":"你要的是一句能落地的话"},{"t":"「就你事儿多。」（然后帮你办了）","w":{"e":3},"e":"嘴上嫌你，手上把你办了——你吃这个"}]}],"levels":{"a":{"name":"安静但一直在的人","line":"他不说话，但你回头他都在","img":"card","look":"偏瘦，个子不用太高，站着的时候有点含肩。头发软，有点乱。手好看，手指长，指甲干净。可能戴一副细边眼镜，也可能不戴。穿米色、灰色、白衬衫这类不出错的颜色。身上是洗衣液的味道，不是香水。笑起来眼睛先弯，声音不大。","character":"话不多，但不是冷。他不说「我会对你好」，但你提过的东西过几天就出现在你桌上。他不争，吵起来会先停一下再说话。他的好是慢的，要相处才知道。","weekend":"周六你还没醒，他已经出门买了豆浆和油条，回来的时候轻手轻脚。下午你们各干各的——你看手机他看书，中间他会把手机转过来给你看个什么，你笑一下就过去了。晚上一起做饭，他切菜你炒，他不抢锅。","daily":"下班会发一句「我到了」，不多说一个字。你说话的时候，他会把手里的东西放下看你。睡前他会等你先睡，或者等你先挂电话。你半夜醒一次，会发现他那边的灯还亮着。","keep":"他不太说话，但你所有说过的小事，他都在做。","verdict":"你适合的是：安静但一直在的人。你要的不是热闹，是旁边有个人，不说话也不尴尬。","verdict_sub":"你的心动点不在大场面，在很小的动作上——他记得你说过的一句话，他等你先睡，你叫他他会应。热闹的人会让你累，安静的人让你松下来。","confidence":"前提是你要的确实是「在」，不是「热情」。如果你最近其实很想被热烈地对待，那你可能更适合带你往外走那一型——重测一次，看第 3 题。","warm":"喜欢安静的人常被说「你要求真低」。但你要的东西一点都不少，只是你要的那些都不在表面上。","seen":["你喜欢那种不用说话也不尴尬的沉默","他记得一件你自己都忘了的小事，你会记很久","你不太需要惊喜，你需要稳定","你被说过「你要求真低」，其实只是你要的不是那些","你最怕的是热闹过后的那一下空"],"watch":"安静和回避只差一线。他不说话的时候，你要看他是「在」还是「不在」——真正安静的人，你叫他他会应；回避的人，你叫他他装没听见。这两个看着一样，过起来完全是两回事。","meet":"书店、图书馆、不吵的咖啡馆、人少的展览。他不混人群，你去安静的地方才碰得到他。","three":["他怎么对服务员和陌生人","你说话的时候，他有没有把手里的东西放下","你随口说过的小事，过几天他记不记得"],"script":"你平时周末都在干嘛？","script_why":"安静的人答这一句会答得很具体。答得越具体，说明他越愿意让你进他的生活。","watch_for":"他答的时候有没有反问你一句。安静的人难得开口，开了就是真的。","reacts":[["他答得很具体，还问了你一句","那这一型成立。安静的人愿意把自己那块地方给你看，这就是他的表白方式。"],["他答得很短，但没躲","他在适应你。别急着把沉默填满，安静的人需要时间。"],["他岔开了话题","那要分清是慢热还是不想让你靠近。再给一次机会，第二次还岔开，就不必了。"]],"decision":{"head":"这一型也有它的难","items":["你想要的东西他未必看得出来，你也得学着说","他安静的时候，你分不清他是舒服还是退出去了","你会习惯不麻烦他，久了连自己想要什么都忘了"],"tail":"安静的人不是不需要你说话。你一直不说，他是真的会以为没事。"},"plan_default":"这周说一次最小的、最具体的要求","plan_label":"我准备怎么试着开口一次"},"b":{"name":"带你往外走的人","line":"你说想去的地方，他真的会带你去","img":"dream","look":"皮肤晒黑一点，短发，笑起来有虎牙，眼角有一点晒出来的细纹。手臂有线条，不是健身房练出来的，是常在外面跑出来的。T 恤、运动鞋，背一个用了很久的包。走路快，会回头喊你快点。","character":"行动比想法快。「走啊」「我带你去」是他的高频句。遇到事不太内耗，先做再说。跟他在一起，你会被拉进很多没试过的事情里。他也不大会说安慰的话——他哄人的方式是带你离开那件事。","weekend":"周五晚上他就把明天要去哪儿定了。周六一早他掀你被子，你还没完全醒就出门了——爬山、市集、一个他听说的什么地方。晚上回来两个人都晒红了，他先去洗澡，你在沙发上瘫着不想动，饭是外卖。","daily":"下班会问「饿了没，我带你去吃」。你犹豫的事情他一句话就给你推过去了：「先试试，不行再说。」他会带你见他的朋友，把你算进他的生活里。","keep":"你在脑子里转了三圈的事，他已经走出门了。","verdict":"你适合的是：带你往外走的人。你想做一件事的时候，通常会在脑子里转好几圈，然后没有然后。你要的是一个替你迈出第一步的人。","verdict_sub":"不是你自己走不动，是你缺一个「走啊」。这一类人的好处不是他有多会玩，是他把你的犹豫缩短了——很多事你不是不想做，你是在等有人先动。","confidence":"前提是你确实想被推一把。如果你其实很需要安稳、不喜欢临时变动，那这一型会让你累——重测看第 3 题。","warm":"你不是懒，也不是没主意。你只是太习惯把「算了吧」说在前面。有人替你把这句话拦下来，你会轻松很多。","seen":["你常常想做一件事情，然后一直没做","你挺羡慕那种说走就走的人","你在家待久了会有点闷，但自己又不会出门","你喜欢被人安排，只要安排得对","你想过去很多地方，但没去过几个"],"watch":"带你往外走和替你决定，是两件事。看他带你去的地方有没有考虑过你——是「我带你去个好地方」，还是「走就对了」。前者你跟着开心，后者你会慢慢不想动。","meet":"球场、爬山的路上、市集、朋友的局、运动类的社群。他不宅，你也得往外走才碰得到。","three":["他说的「下次我们去」，有没有真的发生","他走路快，但会不会回头等你","他带你去的地方，有没有问过你想不想去"],"script":"那我们去？","script_why":"短短一句，最试得出他是不是真的会去。说走就走的人，最怕的反而是对方说「再说吧」。","watch_for":"他是当场定时间，还是说「回头再说」。这两个答案差得很远。","reacts":[["他当场就定了时间地点","那这一型成立。这一类人说到就做，你可以信。"],["他说「再说吧」「回头约」","那他的热情可能只在嘴上。真会带你走的人，不会把「走」留在以后。"],["他定了，但没问你想不想去","这一条要留意：带你走和替你决定是两回事。你现在可以提一次，看他接不接。"]],"decision":{"head":"这一型也有它的难","items":["他的节奏快，你会一直被推着走","你不想做的事，他会觉得「试试就知道了」","你可能永远是那个被带着的人，慢慢没了主意"],"tail":"被带着走很舒服，但你得给自己留一个说「我今天不想出门」的位置。他接得住，这一型才成立。"},"plan_default":"这周跟他提一次「今天我想待着」","plan_label":"我准备怎么试着说一次不想"},"c":{"name":"把日子过细的人","line":"日子被他过成了具体的样子","img":"dream","look":"干干净净。头发清爽，指甲剪得整齐，衣服不一定贵但很平整，领口没有变形。手上有护手霜的味道，或者刚做完饭的味道。笑起来很软，眼睛弯着，声音轻。他收拾过的东西都在该在的地方，你乱放的东西他也不会说你。","character":"慢，细，会照顾人但不让你觉得被管。你没说的事他会先发现——家里缺什么、你今天不太高兴。他不怎么说好听的话，但记得你的生理期和你不吃的东西。","weekend":"周六一起去菜市场或者超市，他挑菜你会被他念「这个不新鲜」。下午他做饭，你在旁边偷吃，被他拍一下手背。晚上窝在沙发上看电影，他会把你的脚拉到他腿上，看完他收拾。周日他洗床单，你在旁边晒，太阳好的时候两个人都不说话。","daily":"早上会问你吃了没。你加班他会说「给你留了饭」。你随口说想吃什么，过两天它就出现在桌上。你生病的时候他会先把药和水放在你够得到的地方。","keep":"跟他在一起，日子是有形状的。","verdict":"你适合的是：把日子过细的人。你一个人过日子的时候，很多事都是对付过去的。你要的不是有人替你安排，是有个人把你的日常接过去。","verdict_sub":"这一类人的好不在惊喜，在重复——他每天都在做同一件小事，做了你才慢慢发现你离不开。你心动的那一下，多半是某个很琐碎的瞬间：他记得你不吃香菜，他把你的杯子先倒满。","confidence":"前提是你确实想被照顾。如果你其实很在意自己的空间、不喜欢被人安排生活，那这一型会让你窒息——重测看第 6 题。","warm":"你可能说过「我不需要人照顾」。但不需要，和有人照顾之后不想放手，是两件不冲突的事。","seen":["你一个人吃饭经常随便对付","你看到别人被照顾会有点羡慕，但不会说","你不太舍得为自己花钱，但看到他会想给他买","你家里乱，但你知道每样东西在哪儿","你说过「我不需要人照顾」，但其实需要"],"watch":"细心和控制只差一句话。细心的人做完会说「你看看这样行不行」，控制的人做完会说「你这样不行」。看他说的是哪一句。","meet":"超市的菜区、做饭的课、朋友的饭局、宠物医院、菜市场。他去的地方都很日常，你得在日常里才碰得到。","three":["他会不会主动问你的口味和不吃的东西","他替你做事的时候，是问过你还是直接决定","你在他面前，能不能什么都不做地待着"],"script":"我不吃香菜。","script_why":"一句最不起眼的话，是这一类人的入场券。他记不记得，比他送什么贵重得多。","watch_for":"下次吃饭的时候他有没有提这一句。随口说的被记住，比刻意送的更准。","reacts":[["他下次真的记得，也没邀功","那这一型成立。这就是细心，不是那天心情好。"],["他记得了，但要跟你说「我特意记的」","他有点邀功，不算大事，但你心里会有数——真细心的人不觉得自己做了什么。"],["他忘了","那他只是那天对你上心。别急着加分，再看一次。"]],"decision":{"head":"这一型也有它的难","items":["被照顾久了，你会慢慢不会自己来","他的细心，有可能慢慢变成「你应该这样」","你会欠下很多句谢谢，久了变成压力"],"tail":"照顾是好事，但照顾不该让你变小。你还是得有自己会做的那几件事。"},"plan_default":"这周有一顿饭我来安排","plan_label":"我准备怎么自己来一次"},"d":{"name":"稳得住的人","line":"你慌的时候，他先稳","img":"card","look":"肩宽，看着比同龄人稳一点。穿深色，衣服简单。手大，递东西的时候很稳。站姿放松，不晃。说话的时候看着你，眼神不飘。他不是人群里最抢眼的那种，但你会注意到他不动——别人都在看手机的时候，他在看路。","character":"不慌。出事的时候他先想，不急着表态。不轻易许诺，说了就做。跟他在一起你会少操很多心，因为有些事你不用自己扛了。他也不太会哄人，他给的安全感是那一句「这件事已经在处理了」。","weekend":"睡到自然醒，他先看新闻你看手机，谁也不着急起。下午一起把杂事办了——交个费、看个东西、顺路买点什么。晚上吃饭会聊很久，他会问你最近怎么样，是真的在听，不是随口问。","daily":"他不秒回，但会回，而且回的是你在问的那件事。你慌的时候他第一句是「没事，我们来想办法」。你的大事他都记得，到了日子他会主动问。","keep":"你慌的时候，他先稳。","verdict":"你适合的是：稳得住的人。你出事的时候第一反应是自己扛，而且不太敢麻烦别人。你要的是一个能替你把那一下接住的人。","verdict_sub":"你不是需要人帮你解决，你需要的是有个人先说一句「没事」。很多事你其实扛得住，难的是扛的时候只有你一个人。这一类人给你的不是办法，是那句「我们一起」。","confidence":"前提是你要的确实是稳。如果你其实很想被热烈对待、不喜欢慢热的节奏，那这一型会让你觉得闷——重测看第 7 题。","warm":"你扛过的事情，没有人知道。你现在不需要证明自己扛得动了。","seen":["你出事的时候，第一反应是自己扛","你不太敢麻烦别人，麻烦完还要补一句谢谢","你特别吃「说话算话」这一套","你慌过，而且是一个人慌的","你希望有人能替你想一次，就一次"],"watch":"稳和闷只差一件事：他会不会跟你说他在想什么。稳的人会跟你讲他的判断，闷的人什么都不说，你只能猜。猜久了，你会比一个人扛还累。","meet":"工作的场合、行业的活动、朋友的朋友、正经的饭局。他不主动社交，但他在正经的地方，而且待得久。","three":["他答应的小事情，做没做","你慌的时候，他的第一句话是什么","他会不会主动跟你说他在想什么"],"script":"这件事我自己有点拿不准。","script_why":"你不用真的需要他解决，看他怎么接这一句就够了——是替你想，还是让你自己看着办。","watch_for":"他是先问情况再说想法，还是直接给你一个答案，还是说「你自己看着办」。","reacts":[["他先问了情况，再慢慢说想法","那这一型成立。稳的人不急着表态，他先要听明白。"],["他直接给了答案","也不错，但要看他有没有听你说完。没听完就给答案，那是急不是稳。"],["他说「你自己看着办」","那不是稳，那是撒手。这两件事看着像，实际上差很远。"]],"decision":{"head":"这一型也有它的难","items":["他稳，你可能会越来越靠他，靠到自己站不住","他不慌，你可能反而不敢在他面前慌","他替你想得多，你会慢慢不自己想"],"tail":"有人替你扛是好事，但别把自己那一份也交出去。"},"plan_default":"这周有一件事我自己拿主意","plan_label":"我准备怎么自己拿一次主意"},"e":{"name":"有点野但只对你软的人","line":"他对别人一个样，对你另一个样","img":"dream","look":"眉眼有点锋利，下颌线清楚，看着不太好惹。穿得随意但有型——黑 T、牛仔，脖子上可能有个链子。笑起来只歪一边嘴，不对称。手上有茧，或者指节很明显。他不怎么对别人笑。","character":"外冷内热。对外人话少，对你话多，而且说的都是没什么营养的废话。有点倔，认死理。不会说好听的话，但他会做，做完还会嘴硬。他不高兴的时候不会讲，你只能从他突然不说话的那几分钟里看出来。","weekend":"周六中午才起，一到晚上人来劲了。他突然说「走，兜个风」，车里放着歌开到没什么人的地方。或者深夜带你去吃一碗面，那个地方只有你们两个知道。白天睡过去，夜里说很多话——说的都是白天不会说的那些。","daily":"嘴上嫌你笨，手上已经把事办完了。不常发消息，但会突然出现在你楼下。他的朋友会跟你说一句：「他跟以前不一样了。」你在别人嘴里听到的他，跟你认识的那个他，常常对不上。","keep":"他不怎么对别人笑，但对你笑的时候很不一样。","verdict":"你适合的是：有点野但只对你软的人。你在别人面前挺乖的，你想要的不是更乖，是有个地方可以不用乖。","verdict_sub":"这一类人迷人的地方不是野，是区别——他对别人一个样，对你另一个样，而且他自己没意识到。你要的不是被保护，是被区别对待。这两件事差很多。","confidence":"前提是你要的是「只对你」，不是「看起来不好惹」。如果他对外人也一样，那不是只对你软，是他本来就飘——这一条要分清楚。","warm":"你在别人面前太久了。想有个地方不用乖，一点都不过分。","seen":["你在别人面前挺乖的，甚至有点无聊","你其实想露出不那么乖的那一面","你容易被那种不太好惹的人吸引","你喜欢被区别对待的感觉，胜过被照顾","你偷偷想过：他是不是只对我这样"],"watch":"「只对你软」要验的是另一半：他对外人是不是真的不一样。如果他对外人也是这套，那不是只对你，是他本来就飘。区别才是这一型的核心，不是锋芒。","meet":"深夜还开着的店、livehouse、球场、你本来不太去的那种地方。他出现的时间跟别人不一样，你得晚一点出门。","three":["他对别人和对你的区别，到底有多大","他嘴上嫌你的时候，手在干什么","他有没有把你带进他的朋友圈"],"script":"你朋友都说你什么样？","script_why":"这一句能试出他愿不愿意让你知道他的过去。对外冷的人，让你知道就是靠近。","watch_for":"他愿不愿意答，以及答的时候是笑着讲，还是马上收起来。","reacts":[["他笑着说了，还补了一句「以前更过分」","那这一型成立。他在让你进他的过去，这个信号很重。"],["他说「没什么好说的」，但没有不高兴","他在守。别追问，等他愿意说的那天。对外冷的人，守是正常的。"],["他只在你面前提你，不在朋友面前提你","这一条要留意：只对你软，和不想让别人知道你，是两回事。"]],"decision":{"head":"这一型也有它的难","items":["他对外人冷，你可能会替他得罪人","他不爱说，你得猜，猜久了很累","他只对你软，也可能是他只对你有要求"],"tail":"只对你软很动人，但它替代不了他对外面世界的态度。那部分你迟早要面对。"},"plan_default":"这周问他一次他的以前","plan_label":"我准备怎么试着靠近一次"}},"img":{"card":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAaQAAAJ7CAYAAACszOVSAAEAAElEQVR42uy9d5xdR3k+/rwzc865ZXtVs4q7LVdksDEYJDAEHDqs6BCaBQFCTQiQ/FZLJwRCByshQEIMrMB2YowNGMsC3OUuuan3lVbb95Zzzsy8vz9mzrkrY4iB5Bts7vBZ1tpyy9l75533eZ9CaK7m+h3X8PCwXL16tQXA2deYuQzgWYf277HX/eTaQkdv9/u+/51/+2RbW9fCFec+8ctKSW5tLVtjSM7Oztx80w2/+vSKc86Vb3rb2wyAI0T0q0e4K8HMBMASETevfHM11+N7UfMSNNejXcxM69evD1avXp0opZCmKUHXV919592vvfyHlx/X3tZ2wZ7duzAxNo69e/egra0VJtE4MjYGEgQSAmmq0dLSgq7uTpTLLTjx5JMxPjmhienbb33nmiAsFX5y7LGnXpqmqSIind33hg0b1KpVq3Tzr9BczdUsSM31p12IBBEBgPX/PvvqK698/f49e1/1k2uuaUWqC1OT45iamtZRFKFYLKBQiKQxxgglICAUkQCzhRAC2li2Rhtmi3o9hmVWHR0dCKICpmdn0dPdObL6Va9Q07PVj7/mL954O4Dbiag6MDAg169fb5mZiMg2/zLN1VzNgtRc+JOD54wvRAu/+2///te33Xrr27ff/4A6NDKCjo5WKKVSpUJRCCNJgsBsAQaYLSw7pE2SgLUWEAAsQ6oAKlCwWsNaZm2NSeKEQQjSNMZstYrOzi6sOPdJWLjomOufvmrlD08+/cwvgwhGa8DDeURkmn+l5mquZkFqrv8lWGzt2rVH/V2WL19OW1avZgAYAjA4OAgAWLsWIBr6X+sUBgcHxdDQkGXm5Vdd8V/v+uk117xw784dfWOHD3NLWwsXwogAgpKCpFDQxqJWr6GepDBaQwUSbBjWGhitEYQhBAlY20DepBQoRAWEUQSlFIQiGOOqWBLHPH5kwrR3tgVQCqedduqOZz3n2Xue/uyL3iWEuIeZH3Ge1VzN1VzNgtRcf0ARuv3229W6deuwbt269Hf     <div style="margin-top:24px">
      <h2>先说你是谁</h2>
      <div class="sub">结果里会带上这些——同一个型，白羊座和天蝎座要的不是同一种人。</div>
    </div>
    ${g('你 的 星 座', D.zodiacs, 'zodiac', true)}
    ${g('你 的 年 龄', D.ages, 'age', false)}
    ${g('你 现 在 是', D.status, 'status', false)}
    <button class="gonext${done?'':' off'}" onclick="toQuiz()">${done?'开始答题':'三项都选一下'}</button>
    <button class="goback" onclick="home()">返回</button>
  </div>`;
}
function setInfo(f,k){ S.info[f] = k; render(); }
function toQuiz(){
  if(!(S.info.zodiac && S.info.age && S.info.status)){ toast('三项都选一下'); return; }
  S.view='quiz'; S.idx=0; S.ans=[]; render();
}
function renderQuiz(){
  const n = D.questions.length, q = D.questions[S.idx];
  const opts = q.o.map((o,i)=>`<button class="opt" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}</b><span>${o.t}</span></button>`).join('');
  app.innerHTML = `<div class="screen active quiz">
    <div class="top">
      <button class="back" onclick="back()">←</button>
      <span class="pnum">${S.idx+1} / ${n}</span>
      <div class="bar"><i></i></div>
    </div>
    <div class="qz">
      <div class="qq">${q.q}</div>
      <div class="qh">凭心动选，别想哪个更对</div>
      <div class="opts">${opts}</div>
    </div>
  </div>`;
  const w = app.querySelector('.bar i');
  requestAnimationFrame(()=>{ w.style.width = ((S.idx+1)/n*100)+'%'; });
}
function choose(i){
  S.ans.push(i);
  if(S.idx+1 < D.questions.length){ S.idx++; render(); }
  else { S.view='result'; render(); }
}
function back(){
  if(S.idx>0){ S.idx--; S.ans.pop(); render(); }
  else { S.view='info'; render(); }
}
function compute(){
  const sc = {};
  D.types.forEach(t=>{ sc[t.key] = 0; });
  D.questions.forEach((q,qi)=>{
    const w = q.o[S.ans[qi]].w || {};
    for(const k in w) sc[k] += w[k];
  });
  let lvKey = D.priority[0], best = -1;
  D.priority.forEach(k=>{ if(sc[k] > best){ best = sc[k]; lvKey = k; } });
  return {sc, lvKey, level: D.levels[lvKey], best};
}
/* 依据：给结果型加分最多的 3 条；反向证据：给别的型加分最多的那一条 */
function evidences(lvKey){
  const items = D.questions.map((q,qi)=>{
    const o = q.o[S.ans[qi]];
    const w = o.w || {};
    return {qi, t:o.t, e:o.e, mine:(w[lvKey]||0), other:Math.max(0, ...Object.keys(w).filter(k=>k!==lvKey).map(k=>w[k]))};
  });
  const top = items.slice().sort((a,b)=> b.mine - a.mine).slice(0,3);
  const used = new Set(top.map(x=>x.qi));
  const rest = items.filter(it=>!used.has(it.qi) && it.other > 0);
  const pick = rest.length ? rest.reduce((a,b)=> b.other > a.other ? b : a) : null;
  return {top, pick};
}
function renderResult(){
  const {sc, lvKey, level} = compute();
  const {top, pick} = evidences(lvKey);
  const zk = (S.info && S.info.zodiac) || 'scorpio';
  const ak = (S.info && S.info.age) || 'a26';
  const sk = (S.info && S.info.status) || 'single';
  const z = D.zodiacs.find(x=>x.k===zk), ag = D.ages.find(x=>x.k===ak), st = D.status.find(x=>x.k===sk);
  const who = `${z.n}座 · ${ag.n} · ${st.n}`;

  const dimHtml = D.types.map(t=>{
    const pct = Math.round(sc[t.key]/t.max*100);
    const hi = t.key===lvKey ? ' hi' : '';
    return `<div class="dim${hi}">
      <div class="dn"><span>${t.name}</span><em>${pct}%</em></div>
      <div class="dtrack"><i data-w="${pct}"></i></div>
    </div>`;
  }).join('');

  const evHtml = top.map(it=>`
    <div class="evitem">
      <div class="q">第 ${it.qi+1} 题 · 你选的是</div>
      <div class="a">「${it.t}」</div>
      <div class="m">${it.e}</div>
    </div>`).join('');
  const negHtml = (pick) ? `
    <div class="evitem neg">
      <div class="q">这组答案里，最不像这一型的 · 第 ${pick.qi+1} 题</div>
      <div class="a">「${pick.t}」</div>
      <div class="m">这一条说明你身上还有别的成分。人是混着的，这份画像画的是你现在最想被对待的那一部分。</div>
    </div>` : '';

  const three = level.three.map(t=>`<li>${t}</li>`).join('');
  const rHtml = level.reacts.map(r=>`
    <div class="r"><div class="rt">${r[0]}</div><div class="rd">${r[1]}</div></div>`).join('');
  const d = level.decision;
  const dHtml = d.items.map(t=>`<li>${t}</li>`).join('');
  const seen = level.seen.map(t=>`<div class="seen"><i></i><span>${t}</span></div>`).join('');
  const closing = D.closing.map(p=>`<p>${p}</p>`).join('');

  const today = new Date().toISOString().slice(0,10);
  let oldHtml = '', histHtml = '';
  try{
    const o = JSON.parse(localStorage.getItem(KEY)||'null');
    if(o && o.do){ oldHtml = `<div class="old"><b>你上次记的：</b>${o.do}${o.when?'（'+o.when+'）':''}<br>这次测完可以对照着看。</div>`; }
  }catch(err){}
  try{
    const h = JSON.parse(localStorage.getItem(HKEY)||'null');
    if(h && h.lv){
      const same = h.lv === lvKey;
      histHtml = `<div class="hist">
        <h4>上 次 和 这 次</h4>
        <div class="hh">上次（${h.at}）：${h.name}${same?'<em>没变</em>':'<em>变了</em>'}<br>这次（${today}）：${level.name}</div>
        <div class="hd">${same ? '两次都一样，说明这真是你想要的那种。' : '这次不一样了——这段时间你变了一些，回头想想是哪件事带的。'}</div>
      </div>`;
    }
  }catch(err){}

  app.innerHTML = `<div class="screen active res">
    <span class="pill">${D.brand} · 适配测试</span>

    <div class="share">
      <div class="sl">我 适 合 的 是</div>
      <div class="sz">${who}</div>
      <div class="sn">${level.name}</div>
      <div class="sk">「${level.line}」</div>
      <div class="sq">${level.keep}</div>
      <div class="sb">${D.brand} · ${D.product}</div>
    </div>
    <button class="cp2" onclick="copyShare()">复制这段去评论区</button>
    <div id="shareText" style="display:none">我是${z.n}座（${ag.n}，${st.n}），测了「${D.product}」，结果是：${level.name}。${level.keep}——${D.brand}</div>

    <div class="zcard">
      <div class="ph">${z.n} 座 的 你</div>
      <div class="zt">${D.ztext[zk]}</div>
      <div class="za">${D.agetext[ak]}</div>
    </div>

    <div class="pt">
      <h3>他 是 这 样 一 个 人</h3>
      <div class="pb look"><div class="ph">长 这 样</div>${level.look}</div>
      <div class="pb chr"><div class="ph">什 么 性 格</div>${level.character}</div>
      <div class="pb wk"><div class="ph">你 们 的 周 末</div>${level.weekend}</div>
      <div class="pb dy"><div class="ph">平 时 会 这 样</div>${level.daily}</div>
    </div>

    <div class="vd">
      <div class="lab">我 的 判 断</div>
      <div class="who">${who}</div>
      <div class="txt">${level.verdict}</div>
      <div class="sub">${level.verdict_sub}</div>
      <div class="conf"><b>这个判断在什么情况下会变：</b>${level.confidence}</div>
    </div>

    ${histHtml}

    <img src="${D.img[level.img]}" width="150" alt="" style="margin:12px auto 0;display:block">

    <div class="dims">
      <h4>你 身 上 的 五 种 想 要</h4>
      <div class="hint">条最长的那个是结果。别的也不是没有，只是没那么想</div>
      ${dimHtml}
    </div>

    <div class="ev">
      <h4>判 断 依 据</h4>
      <div class="hint">下面这几条是你自己选的，不是我替你填的</div>
      ${evHtml}
      ${negHtml}
    </div>

    <div class="stcard">
      <div class="ph">给 现 在 的 你</div>
      <div class="st">${D.statustext[sk]}</div>
    </div>

    <div class="exp">
      <h4>怎 么 认 出 他</h4>
      <div class="en">${level.meet}</div>
      <div class="ew">这一类人不会走到你面前自我介绍。他去的地方、出现的时间都跟别人不太一样——你要去对地方才碰得到。</div>
      <div class="tl">
        <div class="tlh">第一次见面，可以看这三件事</div>
        <ul>${three}</ul>
      </div>
      <div class="sc">
        <div class="sl">可 以 说 的 一 句 话</div>
        <button class="cp" onclick="copyScript()">复制</button>
        <div class="st" id="scriptText">${level.script}</div>
        <div class="sw">${level.script_why}</div>
      </div>
      <div class="wf">说的时候看什么：${level.watch_for}</div>
      <div class="rs">
        <div class="rl">他可能有三种反应，各说明什么</div>
        ${rHtml}
      </div>
    </div>

    <div class="dl">
      <h4>${d.head}</h4>
      <ul>${dHtml}</ul>
      <div class="dt">${d.tail}</div>
    </div>

    <div class="pc">
      <h4>你 的 行 动 卡</h4>
      <div class="ph">填完会存在这台手机上，下次打开还在。7 天后再回来看一眼。</div>
      ${oldHtml}
      <label>${level.plan_label}</label>
      <input id="pDo" value="${level.plan_default}" placeholder="写下你要做的那一件事">
      <label>我准备什么时候做</label>
      <input id="pWhen" placeholder="比如：这周三">
      <label>做完之后，我看他的什么</label>
      <textarea id="pSee" placeholder="比如：看他有没有接">${level.watch_for}</textarea>
      <button class="save" onclick="savePlan()">存下来</button>
      <div class="saved" id="saved"></div>
    </div>

    <div class="warm">${level.warm}</div>
    <div class="sec"><h4>你大概也这样过</h4>${seen}</div>
    <div class="sec"><h4>更需要留意的是</h4><div class="watch">${level.watch}</div></div>

    <div class="keepcard">
      <div class="lab">一 句 可 以 带 走 的</div>
      <div class="txt">${level.keep}</div>
    </div>

    <div class="closing">${closing}<p class="sign">${D.sign}</p></div>
    <div class="disc">本测试只对你提供的选择做行为层面的描述，不预测未来，不构成心理或医疗建议。画出来的这个人不一定存在，你要的那部分是真的。最终判断权在你自己手里。</div>
    <div class="btns">
      <button class="btn o" onclick="home()">回到首页</button>
      <button class="btn p" onclick="again()">再测一次</button>
    </div>
  </div>`;
  try{
    localStorage.setItem(HKEY, JSON.stringify({lv:lvKey, name:level.name, at:today}));
  }catch(err){}
  requestAnimationFrame(()=>{
    document.querySelectorAll('.dtrack i').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
  });
}
function copyShare(){
  const t = document.getElementById('shareText').textContent;
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制，粘到评论区就能晒'); }
  catch(e){ toast('截上面那张卡也可以'); }
  document.body.removeChild(ta);
}
function copyScript(){
  const t = document.getElementById('scriptText').innerText;
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }
  catch(e){ toast('长按上面那段文字也可以复制'); }
  document.body.removeChild(ta);
}
function toast(m){
  const t = document.getElementById('toast');
  t.innerText = m; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 1900);
}
function savePlan(){
  const o = {do:document.getElementById('pDo').value,
             when:document.getElementById('pWhen').value,
             see:document.getElementById('pSee').value,
             at:new Date().toISOString().slice(0,10)};
  try{ localStorage.setItem(KEY, JSON.stringify(o)); }
  catch(e){ toast('这台设备不让保存，截图存一下吧'); return; }
  document.getElementById('saved').innerText = '存好了 · ' + o.at + '，7 天后回来对照';
}
function again(){ S = {view:'quiz', idx:0, ans:[], info:S.info}; render(); }
function home(){ S = {view:'home', idx:0, ans:[], info:{zodiac:null,age:null,status:null}}; render(); }
render();
</script>
</body>
</html>
