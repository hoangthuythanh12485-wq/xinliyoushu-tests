0,"e":"你的日常不需要预审"},{"t":"一半左右","p":1,"e":"有一部分要先过一遍"},{"t":"少数几件","p":2,"e":"预审已经成了习惯"},{"t":"几乎没有","p":3,"e":"你的决定权已经交出去大半"}]},{"dim":"mine","q":"这段关系里，你改掉的习惯有几样？","o":[{"t":"没有","p":0,"e":"你没有为这段关系削掉自己"},{"t":"一两样，我自己也愿意","p":1,"e":"有调整，但是主动的"},{"t":"好几样，说不清愿不愿意","p":2,"e":"已经在让步，但没算过账"},{"t":"挺多的，有时候想不起原来的自己","p":3,"e":"削得太多了，这是最该留意的一条"}]},{"dim":"mine","q":"他说「为你好」的时候，你的第一感觉是？","o":[{"t":"被照顾","p":0,"e":"这句话在你这里是暖的"},{"t":"有点烦，但知道是好意","p":1,"e":"有摩擦，但底子是信任"},{"t":"有压力，像要交作业","p":2,"e":"这句话已经变成任务了"},{"t":"紧张，想着怎么解释","p":3,"e":"一句话能让你紧绷，说明里面有代价"}]}],"levels":{"C1":{"name":"是真的关心","line":"他说的那些，说完就过去了","img":"choose","verdict":"我的判断是：他确实在担心你，不是在管你。他说完就过去了，没有回头验收，也没有「你不听我就变脸」。","verdict_sub":"这一种最常见的误会是——他提了一次，你记了半年。然后你开始觉得自己被管着。其实那条「规矩」，是你自己立的。","confidence":"这个判断的前提是「说过就过」。如果哪天你发现他会回头问、会记住、会因为你没听而不高兴，那就不是这一档了，重新测一次。","warm":"如果你测出来是这一种，先说一句：你没有被管着。你可能是被自己那句「他会不会不高兴」管住了——这跟他是两回事。","seen":["他说过一句少喝奶茶，你后来每次喝都会想起这句话","你已经很久没在他面前提自己想做的事了","他一皱眉，你会先想是不是自己哪里不对","你其实没被他限制过什么，但总觉得有个隐形的框","你怕的不是他生气，是让他失望"],"watch":"最要防的是「自己给自己立规矩」。他没说过的话，你在心里替他补全了，补得比他自己还严。这一条不解决，换谁都一样。","exp":{"name":"记一周，看他说过几次","why":"这一档最需要的是事实，不是感觉。你脑子里那句「他老是管我」，需要用一周的数字来对一次账。","script":"（不用发。这周随手记：他提过几次、说完有没有再提。）","watch_for":"数字。提了几次，有没有第二次。","reacts":[["一周记下来，其实只提过一两次","那这一档成立。你被管的感觉来自你自己的预演，不是他的要求。接下来要练的是：他说完，你就当他说完了。"],["记下来发现次数不少，而且他会再提","那可能不是第一档。回到「不听的代价」那几题再对一次。"],["你发现根本不用记，脑子里全是例子","先别急着下结论。把最具体的那三件事写下来，看时间跨度有多长——半年三件和一周三件，完全是两回事。"]]},"decision":{"head":"出现这些，就不是「只是关心」了","items":["他会在几天后回头问你有没有照做","你不听，他会有明显的不高兴，而且不止一次","你开始提前猜他会怎么说，再决定自己怎么做"],"tail":"关心不需要你预演。你开始在脑子里替他排练台词的时候，这段关系的性质就变了。"},"plan_default":"这周记一次：他提过几件、说完有没有再提","keep":"说过就过的，是关心；回头查的，才是管。"},"C2":{"name":"管得有点宽","line":"范围很大，但没有惩罚","img":"mytea","verdict":"我的判断是：他的边界感比较糊，什么都想插一句，但你不听，他也不会怎么样。这是唠叨，还不是控制。","verdict_sub":"这两件事的差别不在语气，在后果。他可以说得很重、很难听，但只要说完就过去了，里面就没有惩罚。控制是有代价的，唠叨没有。","confidence":"前提是「不听也不会怎样」。如果他的反应一直在升级——从说两句变成不高兴，再变成冷战——那就不是这一档了。","warm":"这一种最容易被误判成「他控制欲强」。你烦是真的，但烦和怕不是一回事。别把烦当成怕，也别因为烦就给他扣帽子。","seen":["他什么都要评价一句，你听着累，但也不至于怕","你有时候会瞒着做，纯粹是不想听他念","他说完其实也不追究，过两天自己就忘了","你偶尔会顶回去，他也就算了","你分不清这是关心还是管，因为两样都有"],"watch":"最要防的是「反正他也不会怎样，我就一直忍」。忍久了，你会开始自动过滤——不说了、不做了、不买了。到那一步，管的人还是他，让的人已经是你自己。","exp":{"name":"设一次边界，看他接不接","why":"唠叨型的关系不用摊牌，只需要一次清楚的表态。你要看的不是他同不同意，是他能不能接受「你有不同意的权利」。","script":"这件事我想自己决定。你要是担心可以跟我说，但最后我想按我的来。","watch_for":"他有没有把「你可以自己决定」这句话接住。","reacts":[["他说行，然后就真的不提了","这一档确认。他要的只是参与感，不是决定权。以后用同一句话就行。"],["他嘴上说行，过两天又提","他的「参与」有点黏。把同一句话说第二遍，不用解释更多。"],["他不高兴，开始说你不懂事","那要重新看：这句话碰到了他的哪根线。如果每次表态他都这样，就不是唠叨了。"]]},"decision":{"head":"这些出现，就不只是唠叨","items":["你拒绝之后，他会记着，过几天再提一次","你开始瞒着他做一些事，不是怕他管，是怕他念","你在他面前越来越少说自己的打算"],"tail":"瞒着做，是关系开始变形的地方。不是因为他管得多，是因为你不敢让他知道。"},"plan_default":"挑一件小事，清楚地说一次「我想自己决定」","keep":"没惩罚的叫唠叨，有惩罚的才叫控制。"},"C3":{"name":"只管一件，但那件不能碰","line":"平时都随你，只有一条是硬的","img":"choose","verdict":"我的判断是：他管的事不多，但那一件是硬的。别的你说了算，碰到那一条就必须按他的来，而且你不听是有代价的。","verdict_sub":"这一种最容易被漏掉，因为他「平时挺尊重你的」。但控制不看面积，看的是——有没有一块地方，你说了不算，而且是必须不算。","confidence":"前提是「只有那一件」。如果这样的地方不止一处，那就不是这一档，是范围更大的接管。","warm":"你可能会觉得这不算什么，「他其他地方都挺好的」。这句话本身值得留意——你不是在评估他，是在说服自己。","seen":["大部分事他都随你，唯独那一样，你一提他就变脸","你已经学会绕开那个话题，绕得很自然","你跟朋友说过「他其他地方真的挺好的」","你算过一笔账：就这一件事，忍一下也值","你其实知道那件事对你重要，只是不敢要"],"watch":"最要防的是用「他其他地方都很好」来抵消这一条。好是真的，那一条也是真的。它们不互相抵消，只是同时存在。","exp":{"name":"碰一次那一条，量一量代价","why":"这一档要判断的不是他好不好，是那一块有多大。方法只有一个：碰一次，看代价。","script":"我知道你不喜欢我这样。但这件事我想按自己的来一次，你可以不习惯。","watch_for":"代价的形式和长度：是一句不高兴，还是三天冷战。","reacts":[["他不高兴，但当天就过去了","那这一条是软边界。你可以继续用这种方式谈，但要每次都说明白，别让它变回默认。"],["他冷了两三天，最后是你要去和好","那这一条的代价是你在付。以后每碰一次都是你先低头，这件事本身要谈。"],["他说「你要是这样，那我们就没什么好说的」","这是拿关系本身当筹码。到这一步，那一条已经不是偏好，是条件。"]]},"decision":{"head":"这些出现，就该认真谈了","items":["你为了避开那一条，已经开始绕着走","你已经很久没在那件事上做过自己的决定","每次都是你先低头，然后再也不提"],"tail":"一块不能碰的地方，会把整段关系慢慢压成那个形状。不是那件事多重要，是「不能碰」这件事本身在改变你。"},"plan_default":"挑那一条，碰一次，量一量代价","keep":"控制不看面积，看有没有不能碰的那一块。"},"C4":{"name":"他在接管你的生活","line":"不是为你好，是要你按他的来","img":"mytea","verdict":"我的判断是：他已经管到了你的身体、时间、钱和社交，而且你不听是有代价的。这不是「关心说重了」，这是接管。","verdict_sub":"关心和接管的分界不在语气，在后果。关心是「我说了，你听不听随你」；接管是「我说了，你不听我就有反应」。你现在这一组答案，落在后一半。","confidence":"前提是「不听有代价」。这一条你自己最清楚——你有没有因为没听他的，付过代价。如果有，这个判断就成立。","warm":"看到这个结果，可能会先替他解释一句「他也是为我好」。先别急着解释，就着这组答案看：你最近一次自己做了决定、他没有反应，是什么时候？","seen":["你买什么、几点睡、见谁，都要先在心里过一遍他","你已经很久没有「不用解释」地做过一件事","你身边的朋友少了，或者见谁要挑他不知道的时间","你跟他说话前会先想措辞，怕说错","你有时候会想：我怎么变得这么小心"],"watch":"最要防的是把它翻译成「他在乎我」。在乎一个人，不会让你越来越小心。真的在乎里，不该有怕。","exp":{"name":"先拿回最小的一件","why":"这一档不适合一次性摊牌，也不适合继续忍。要做的是拿回一件最小的事，看他是接受，还是加码。这一步不是为了赢，是为了看清。","script":"这周我想自己安排一次，不用报备。你可以不习惯，但我想试试。","watch_for":"他是接受了一个小变化，还是立刻升级成一场争论。","reacts":[["他愣了一下，然后接受了","那说明范围是可以谈的，不是铁板。接下来一件一件谈，别一次全要。"],["他接受了，但之后一直提这事","接受是表面的，代价换了个形式。这时候要把话说清：你要的是这件事，不是每次都被翻出来。"],["他直接升级成争吵或者冷战","那这一档就确认了。你要处理的不是这件小事，是「你能不能有自己的事」这件事。"]]},"decision":{"head":"到了这一步，该停了","items":["你不听他的，会付出明确代价（冷战、翻旧账、被说成不懂事）","你已经习惯先想他同不同意，再决定自己做什么","你见谁要挑他不知道的时间，或者干脆不去了"],"tail":"这三条中两条，就够了。停不是分手，是先停掉「什么都得经过他」这个流程。你不需要先想好退路，才能拿回自己的事。"},"plan_default":"这周拿回一件最小的事，不报备、不解释","keep":"他要的是你听话，不是你健康。"}},"img":{"choose":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAaQAAAH6CAYAAABIyDiyAAEAAElEQVR42uy9d5xeVZ0//v6cc+992vSZJJNeSIGEHnqPiCJiWTWxra6sGmzouvrT3XU1yde1rW0tKMReViWxgooFTQJITaQHCJCemUmmPr3ce87n98c5tzyTSQDFunN5DUlmnnnqvedzPu/PuxD+Og5iZqxfv9658sor/YluMPD49lfu2rG744477sLOhx9Fa1vHjPlL5p9+z93bfiIgZLVWVT09U+G4Dnq6O3HmBWfrU047U6R7erYR0V0T3efWa691l69erUDEBDAmj8lj8pg8Jo+/XCH4Sz74hg0b5ENXX03rtmwJwu8x8/E/+cp33WK1eFnvlM4X3nHrLWrnY7vlwoXzz4BmaKWgAx+BUlCBj1wuB4IAU/xiGAzpuXDcFIbHxgpBrfHQBc8636FM5rf3/u6e773v6o87AHYT0VDi6cg1a9bwunXr9ORpMXlMHpPH5PF/oCDxmjViLYDt27fTxo0blS1C6W9cc013ZWjsA6VS5Y2oVmjw4CEICbTkskinMqhWq9r3Ay2JQCTAxARmUqy1ChQcV0JrDSEdCACCBPwggJDkuK6DSqmKAIDnepiz4BgMDB3ccda552yesXDOdcuWn3knCVEGM1auXCmXLl3Ka9euZSKa7Jomj8lj8pg8/h4L0rXXXusmIbnf/OQnz/rBNzfM6+7q+MDgwKGp06Z0Z0qlEnK5jMpms1Sv1bleraJarYFJSBDguC4814XjuEhn0lCKQcTQgYIQBGagWq+ikM+DtAYEcSrl6WwmC5IOmJka9TpLSVI4LoaGx/SSE44r5lpbPvmSl77q692LZu0Ln9/WrVvd5cuXB5OFafKYPCaPyePvoCAxM21ctUqsiruh2Tdf/9M33Hnr7c/d+chjp/V0dUrt+2jJtcAP/KBSq8tyuULVWg3tXR1o62jDnAXzMHv2bDgpF0tOOgHSceA5DlKZNAQIJAhaM8CMgBmlsTGUSkXUimUM7O/Hzicew/7de1EuFNGo1yFYoLU   app.innerHTML = `<div class="screen active quiz">
    <div class="top">
      <button class="back" onclick="back()">←</button>
      <span class="pnum">${S.idx+1} / ${n}</span>
      <div class="bar"><i></i></div>
    </div>
    <div class="qz">
      <div class="qq">${q.q}</div>
      <div class="qh">凭最近半年的真实情况选</div>
      <div class="opts">${opts}</div>
    </div>
  </div>`;
  const w = app.querySelector('.bar i');
  requestAnimationFrame(()=>{ w.style.width = ((S.idx+1)/n*100)+'%'; });
}
function choose(i){
  S.ans.push(i);
  if(S.idx+1 < D.questions.length){ S.idx++; render(); }
  else { S.view='result'; render(); }
}
function back(){
  if(S.idx>0){ S.idx--; S.ans.pop(); render(); }
  else { S.view='home'; render(); }
}
function compute(){
  const dim = {scope:0, press:0, self:0, mine:0};
  D.questions.forEach((q,qi)=>{ dim[q.dim] = (dim[q.dim]||0) + q.o[S.ans[qi]].p; });
  const scope = dim.scope, press = dim.press;
  let lvKey;
  if(scope>=7 && press>=6) lvKey='C4';
  else if(scope>=7) lvKey='C2';
  else if(press>=6) lvKey='C3';
  else lvKey='C1';
  return {total:scope+press, dim, lvKey, level: D.levels[lvKey]};
}
/* 挑最有信息量的 3 条：偏离中间(1.5)最远；反向证据只在未引用的题里找 */
function evidences(){
  const items = [];
  D.questions.forEach((q,qi)=>{
    const o = q.o[S.ans[qi]];
    items.push({qi, p:o.p, t:o.t, e:o.e, dev:Math.abs(o.p-1.5)});
  });
  const sorted = items.slice().sort((a,b)=> b.dev - a.dev);
  const top = sorted.slice(0,3);
  const used = new Set(top.map(x=>x.qi));
  let worst = null;
  items.forEach(it=>{
    if(used.has(it.qi)) return;
    if(!worst || it.p > worst.p) worst = it;
  });
  if(worst && worst.p < 2) worst = null;
  return {top, worst};
}
function renderResult(){
  const {total, dim, lvKey, level} = compute();
  const {top, worst} = evidences();

  const dimHtml = D.dims.map(d=>{
    const pct = Math.round(dim[d.key]/d.max*100);
    return `<div class="dim">
      <div class="dn"><span>${d.name}</span><em>${d.desc}</em></div>
      <div class="dtrack"><i data-w="${pct}"></i></div>
    </div>`;
  }).join('');

  const evHtml = top.map(it=>`
    <div class="evitem">
      <div class="q">第 ${it.qi+1} 题 · 你选的是</div>
      <div class="a">「${it.t}」</div>
      <div class="m">${it.e}</div>
    </div>`).join('');
  const negHtml = (worst) ? `
    <div class="evitem neg">
      <div class="q">最该留意的缺失 · 第 ${worst.qi+1} 题</div>
      <div class="a">「${worst.t}」</div>
      <div class="m">这条是你这组答案里最弱的一环。其他项可以靠时间观察，这一条不会自己变好。</div>
    </div>` : '';

  const e = level.exp;
  const rHtml = e.reacts.map(r=>`
    <div class="r"><div class="rt">${r[0]}</div><div class="rd">${r[1]}</div></div>`).join('');
  const d = level.decision;
  const dHtml = d.items.map(t=>`<li>${t}</li>`).join('');
  const seen = level.seen.map(t=>`<div class="seen"><i></i><span>${t}</span></div>`).join('');
  const closing = D.closing.map(p=>`<p>${p}</p>`).join('');

  let oldHtml = '';
  try{
    const o = JSON.parse(localStorage.getItem(KEY)||'null');
    if(o && o.do){ oldHtml = `<div class="old"><b>你上次记的：</b>${o.do}${o.when?'（'+o.when+'）':''}<br>这次测完可以对照着看，有没有变化。</div>`; }
  }catch(err){}

  app.innerHTML = `<div class="screen active res">
    <span class="pill">${D.brand} · ${D.product}</span>

    <div class="share">
      <div class="sl">我 的 结 果 卡</div>
      <div class="sn">${level.name}</div>
      <div class="sk">「${level.line}」</div>
      <div class="sq">${level.keep}</div>
      <div class="sb">${D.brand} · ${D.product}</div>
    </div>
    <button class="cp2" onclick="copyShare()">复制这段去评论区</button>
    <div id="shareText" style="display:none">我测的是「${D.product}」，结果是：${level.name}。${level.keep}——${D.brand}</div>

    <div class="vd">
      <div class="lab">我 的 判 断</div>
      <div class="txt">${level.verdict}</div>
      <div class="sub">${level.verdict_sub}</div>
      <div class="conf"><b>这个判断在什么情况下会变：</b>${level.confidence}</div>
    </div>

    <img class="rimg" src="${D.img[level.img]}" width="150" alt="">

    <div class="dims">
      <h4>你 的 四 项 体 检</h4>
      <div class="hint">条越长，这一项特征越明显（不是越长越好）</div>
      ${dimHtml}
    </div>

    <div class="ev">
      <h4>判 断 依 据</h4>
      <div class="hint">下面这几条是你自己选的，不是我替你填的</div>
      ${evHtml}
      ${negHtml}
    </div>

    <div class="exp">
      <h4>7 天 内 可 以 做 的 一 件 事</h4>
      <div class="en">${e.name}</div>
      <div class="ew">${e.why}</div>
      <div class="sc">
        <div class="sl">可 以 直 接 发 的 话</div>
        <button class="cp" onclick="copyScript()">复制</button>
        <div class="st" id="scriptText">${e.script}</div>
      </div>
      <div class="wf">做的时候看什么：${e.watch_for}</div>
      <div class="rs">
        <div class="rl">可能出现三种情况，各说明什么</div>
        ${rHtml}
      </div>
    </div>

    <div class="dl">
      <h4>${d.head}</h4>
      <ul>${dHtml}</ul>
      <div class="dt">${d.tail}</div>
    </div>

    <div class="pc">
      <h4>你 的 行 动 卡</h4>
      <div class="ph">填完会存在这台手机上，下次打开还在。7 天后再回来看一眼。</div>
      ${oldHtml}
      <label>我决定做的一件事</label>
      <input id="pDo" value="${level.plan_default}" placeholder="写下你要做的那一件事">
      <label>我准备什么时候做</label>
      <input id="pWhen" placeholder="比如：这周三">
      <label>做完之后，我看他的什么</label>
      <textarea id="pSee" placeholder="比如：看他有没有回头问">${e.watch_for}</textarea>
      <button class="save" onclick="savePlan()">存下来</button>
      <div class="saved" id="saved"></div>
    </div>

    <div class="warm">${level.warm}</div>
    <div class="sec"><h4>这阵子，你大概也这样过</h4>${seen}</div>
    <div class="sec"><h4>更需要留意的是</h4><div class="watch">${level.watch}</div></div>

    <div class="keepcard">
      <div class="lab">一 句 可 以 带 走 的</div>
      <div class="txt">${level.keep}</div>
    </div>

    <div class="closing">${closing}<p class="sign">${D.sign}</p></div>
    <div class="disc">本测试只对已发生的行为做解读，不预测未来，不构成心理或医疗建议。最终判断权在你自己手里。单一场景不作数，两个以上一起看。如果你正处于长期的低落或焦虑状态，请寻求专业的帮助。</div>
    <div class="btns">
      <button class="btn o" onclick="home()">回到首页</button>
      <button class="btn p" onclick="again()">重新测一次</button>
    </div>
  </div>`;
  requestAnimationFrame(()=>{
    document.querySelectorAll('.dtrack i').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
  });
}
function copyShare(){
  const t = document.getElementById('shareText').textContent;
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制，粘到评论区就能晒'); }
  catch(e){ toast('截上面那张卡也可以'); }
  document.body.removeChild(ta);
}
function copyScript(){
  const t = document.getElementById('scriptText').innerText;
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制，可以粘去发'); }
  catch(e){ toast('长按上面那段文字也可以复制'); }
  document.body.removeChild(ta);
}
function toast(m){
  const t = document.getElementById('toast');
  t.innerText = m; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 1900);
}
function savePlan(){
  const o = {do:document.getElementById('pDo').value,
             when:document.getElementById('pWhen').value,
             see:document.getElementById('pSee').value,
             at:new Date().toISOString().slice(0,10)};
  try{ localStorage.setItem(KEY, JSON.stringify(o)); }
  catch(e){ toast('这台设备不让保存，截图存一下吧'); return; }
  document.getElementById('saved').innerText = '存好了 · ' + o.at + '，7 天后回来对照';
}
function again(){ S = {view:'quiz', idx:0, ans:[]}; render(); }
function home(){ S = {view:'home', idx:0, ans:[]}; render(); }
render();
</script>
</body>
</html>
