<script>
const D = {"brand":"yeah yeah","product":"五问判断","questions":[{"dim":"did","q":"这件事里，他具体做过什么？","o":[{"t":"他做了一件具体的、要花力气的事","p":0,"e":"有动作，而且那件事需要他付出——这是最实在的一种"},{"t":"他说了很多，但没落到动作上","p":2,"e":"话很满，事没有。话说得越好听，越要回头看动作"},{"t":"他做了，但一定要被看见、要说给别人听","p":2,"e":"动作有了，只是那动作是做给你和别人看的"},{"t":"他什么都没做，一直是你在维持","p":3,"e":"这一条最重：维持这件事的力气，全在你这边"}]},{"dim":"said","q":"这件事，你跟他说过吗？他听完什么反应？","o":[{"t":"说过，他后来改了","p":0,"e":"提了有用，这是最好判断的一种"},{"t":"说过，当时应了，后来还是原样","p":2,"e":"答应过但没变化——他不是在拒绝你，是在敷衍你"},{"t":"说过，他不高兴，之后我就不提了","p":3,"e":"提一次付一次代价，最后是你闭嘴"},{"t":"没说过，我在等他自己发现","p":1,"e":"还没试过。这不是坏消息，是信息还没拿到"}]},{"dim":"cost","q":"为了这件事，你额外花了多少力气？","o":[{"t":"几乎没有，该怎样怎样","p":0,"e":"这件事没有占用你额外的心力"},{"t":"会多想一阵，但过得去","p":1,"e":"有消耗，但还能自己消化"},{"t":"要猜他的意思、要忍、要替他圆","p":2,"e":"你已经在为这件事付隐形的力气，而且没人看见"},{"t":"每天围着这件事转，别的都顾不上","p":3,"e":"它已经成了你日常的底色，这比事情本身更耗人"}]},{"dim":"explain","q":"你在朋友面前，怎么讲他这件事？","o":[{"t":"如实说，不用替他圆","p":0,"e":"你不需要为这件事做翻译"},{"t":"会说「他其实……」，替他找理由","p":2,"e":"你在替他解释，说明你自己也觉得这一关过不去"},{"t":"干脆不提他了","p":2,"e":"不提不是没事了，是这件事已经说不出口"},{"t":"会说他的好，说完自己心里有点空","p":3,"e":"你说服得了别人，说服不了自己——这一条最诚实"}]},{"dim":"future","q":"如果接下来三个月还是这样，你还愿意吗？","o":[{"t":"愿意，我清楚自己在选什么","p":0,"e":"你是主动留在这儿的，这不是忍"},{"t":"说不好，看到时候我还有没有力气","p":2,"e":"你已经在用「还有没有力气」来衡量，而不是用愿不愿意"},{"t":"不愿意，但我不知道怎么停","p":3,"e":"想要的和不想要的都很清楚，缺的是出口"},{"t":"想都不敢想","p":3,"e":"连想象都绕开了，说明你已经知道答案是什么"}]}],"levels":{"A":{"name":"还不用下结论","line":"信息不够，先别定性","img":"note","verdict":"我的判断是：现在手上的这些，还不够下结论。你填的这几条里，动作、反应、你花的力气都还轻——最可能的情况是，这件事只发生过一次，或者还在开头。","verdict_sub":"判断最怕的不是判错，是判早。一次不算数，两次才有形状。你现在最该做的不是下结论，是把这一次的日期和事实记下来。","confidence":"这个判断会变的情况：同样的事在三个月里出现第三次。到那一步，就不是「还在开头」了，是「已经这样了」。","warm":"想马上有个答案，这很正常，悬着是最难受的。但你现在拿到的不是一个坏结果，是「还没到时候」——这比随便塞给你一个结论要诚实。","seen":["你其实说不清这件事发生过几次","你怕的不是他怎么样，是不知道自己该不该在意","你想过「是不是我太敏感了」","你把这件事跟朋友说过，说的时候发现讲不出重点","你在等一个更明确的信号，好让自己放心"],"watch":"最要防的是自己先吓自己。信息不够的时候，人会本能地往最坏的方向补全，而补出来的那部分不是事实。你现在要防的不是他，是你脑子里那个剧本。","exp":{"name":"记一次，别急着定性","why":"这一档最需要的是时间，不是动作。你要做的只有一件事：把这次的事写下来，等下一次出现时对一下。写下来的意义在于，下次你不用靠感觉判断「是不是又来了」。","script":"（不用发。记：几月几日，发生了什么，他做了什么，我做了什么。）","watch_for":"下一次出现的时间间隔。一周内又来一次，和三个月才来一次，是两件完全不同的事。","reacts":[["三个月里没再出现同样的情况","那这一档成立。它是一次性的事，不是这段关系的形状。你可以把心放回去了。"],["一个月内又出现了一次","两次了，开始有形状。回到这五问再过一遍，重点看第 2 题——你到底有没有跟他说过。"],["你发现其实已经发生过好几次，只是之前没算","那就别等了。把次数数清楚再来测一次，你手上的信息其实比你以为的多。"]]},"decision":{"head":"什么时候就不该再等了","items":["同样的事在三个月里出现第三次","你开始在他开口之前先猜他的反应","你已经在朋友面前替他解释过这件事"],"tail":"一次是事件，三次是形状。到第三次，就不用再等第四次来确认了。"},"plan_default":"记下这一次：日期、发生了什么、他做了什么","keep":"一次不算数，两次才有形状。"},"B":{"name":"该谈一次","line":"有件具体的事可以谈，先谈","img":"note","verdict":"我的判断是：还没到要下结论的地步，但你手上有一件具体的、可以提出来的事，而它还没被正式说出口（或者说过有用）。先谈一次，再决定。","verdict_sub":"很多关系不是坏在对方不好，是坏在一件事从来没被真的说出口。你在心里演了十遍，他一次都没听见——那这十遍就不算他的。","confidence":"前提是「这件事还没被清清楚楚地提过」。如果你已经提过三次以上，那不是这一档，回去看第 2 题，你选的应该是「说过，他应了但没变」。","warm":"不敢提，往往不是怕他，是怕提了之后答案不好看。但你不提，那个答案也不会变好，只是你一直不知道而已。","seen":["你在心里把那句话练过很多遍，最后发的是另一句","你暗示过，他没接住，然后你说「算了」","你提过一次，他当时应了，你就不敢再提第二次","你怕提了显得自己计较","你其实知道具体要什么，只是说不出口"],"watch":"最要防的是暗示。说三分、留七分，等他自己懂。他不懂不是因为笨，是因为你真的没说。這一档的人，吃亏全吃在「我以为他应该知道」。","exp":{"name":"提一件具体的、他能做的事","why":"谈一次要有效，得满足两个条件：具体、有时间点。「你能不能多关心我一点」没有抓手，他做不到，你也没法验收。要换成一件他能直接动手的事。","script":"这周三我要搬个东西，你能来帮我一下吗？大概一个小时。","watch_for":"别只看他答不答应，看他答应的方式，和事后提不提。","reacts":[["他来了，事后也没提","说明他不是不愿意，是以前没有具体的机会。你可以开始提更多具体要求——他属于「你说了他就会做」的人。"],["他答应了，但当天没出现，或者事后一直拿来说","你拿到两个信息：他愿意表态，但落不到地上。下一次换一件更小、更容易做的事，再量一次。"],["他推了，理由含糊","一次说明不了什么，连续两次就是答案。别急着定性，但你自己记着。"]]},"decision":{"head":"这些出现，就不是「谈一次」能解决的了","items":["你已经提过三次以上，每次都是同样的话","他答应完就忘，你一提醒他就不高兴","你提之前要算很久：他会不会生气"],"tail":"提一次是沟通，提三次是乞讨。到第三次还停在原地，问题就不在「有没有说清楚」了。"},"plan_default":"挑一件具体的、他能做的事，这周提一次","keep":"说三分留七分，他听到的只有那三分。"},"C":{"name":"该减码了","line":"你说过了，事情没变","img":"hold","verdict":"我的判断是：你提过，他听过，事情没有变。这一档最累的地方就在这——你不是不敢说，你是说了没用。","verdict_sub":"提过没用之后，人通常会做两件事：要么提得更重，要么干脆不提。两个方向最后都指向同一个结果——你的力气继续往外花，事情继续不动。","confidence":"前提是「提过、没有变化」。如果你其实只提过一次，而且是含含糊糊地提的，那先回到「该谈一次」那一档，别急着减码。","warm":"说到没用还在说，是最消耗的一种。你不是没努力，是努力的方向不对——问题不在你说了几遍，在他听完做不做。这一句话能帮你省下很多力气。","seen":["同一件事你已经说过不止一次，说完就后悔","你开始降低标准，跟自己说「其实也还好」","你跟朋友提过，说完还要替他补一句","你现在不提了，但不是放下了，是懒得说了","你分不清是习惯了，还是真的没关系了"],"watch":"最要防的是「替他把这件事消化掉」。你说的那件事没有被解决，但被你自己消化了——你调低了预期、改了标准，然后说「其实也还好」。消化的人一直是你，事情一动没动。","exp":{"name":"停一次，把球还给他","why":"这一档不能再加码，要减码。方法不是吵架，是你撤出一直在做的那部分，看这件事会不会自己塌下去。塌了，就说明一直是你在一个人撑着。","script":"这件事我先不管了，你自己看着办吧。","watch_for":"你撤出来之后，他会不会接。别看嘴上说什么，看那件事最后有没有人做。","reacts":[["他接了，事情照常推进了","那说明这件事本来就是你在过度承担。以后同一类的事，你可以少做一点，天不会塌。"],["他没接，事情就这么放着了","那你就知道了：这件事只有你在乎。它到底重不重要，现在有答案了——这个答案比继续提十次有用。"],["他反过来怪你不管了","这是最要看清的一种。你做了是应该的，你不做就是你的错——这个逻辑本身，比那件具体的事更值得谈。"]]},"decision":{"head":"这些出现，就真的该停了","items":["你说了三次以上，每次都是同样的话","你在降低标准，说服自己「其实也还好」","你在朋友面前替他解释过这件事"],"tail":"减码不是放弃，是把你一直在替他付的那部分拿回来。拿回来之后他补不补，那是他的事，不是你的。"},"plan_default":"挑一件你一直在替他做的事，这周撤出来一次","keep":"说三遍没用，就不是没说清楚，是他没打算改。"},"D":{"name":"已经在耗你","line":"不是那件事的问题，是你在被消耗","img":"hold","verdict":"我的判断是：这一组答案里，动作、反应、你花的力气、你替他解释、你对以后怎么看，五项都偏重了。这不是「某件事没处理好」，是这段关系在持续地花你的力气，而回收回来的很少。","verdict_sub":"到这一档，我不打算给你一个「他到底爱不爱你」的答案，那不是我能给的。我能说的是：按你填的这些，现在这种过法，你在往外掏，而且掏了有一阵子了。","confidence":"前提是「持续」。如果这五条里有两条以上其实只发生过一次，那要重新看。判断看的是形状，不是某一天。","warm":"看到这个结果，第一反应通常是替他解释一句「他也不容易」。先别急着解释。你花了多少力气，你比谁都清楚——这份判断不是给你的关系打分，是给你自己一个说法。","seen":["你提要求之前，会先在心里算一遍他会不会不高兴","你在朋友面前说他的好，说完自己心里有点空","你已经很久没有「不用解释」地做过一件事","你有时候会想：我怎么变得这么小心","三个月后还是这样，你想都不敢想"],"watch":"最要防的是把「他也不容易」当成继续下去的理由。他不容易是真的，你被消耗也是真的，这两件事不互相抵消，只是同时存在。","exp":{"name":"先拿回一件最小的事","why":"这一档不适合一次性摊牌，也不适合继续硬撑。先拿回一件最小的、不靠他也能做成的事，用它来量一下：拿回自己，你是什么感觉。这个感觉本身就是信息。","script":"这周我自己的事我自己安排，就不跟你报了。","watch_for":"做完之后你的感觉：是松了一口气，还是更慌了。","reacts":[["做完之后是松的","那说明你缺的正是这个。继续，一件一件拿回来，不用一次全要。"],["做完之后更慌，一直怕他生气","那说明「怕」已经成了你的默认状态。这时候要处理的不是这一件事，是这个怕。"],["他完全没有反应，根本没注意到","这也是一种答案。你以为很重要的事，在他那里没有位置——这个落差本身就是信息。"]]},"decision":{"head":"到这一步，就该停了","items":["你提要求之前，会先算他会不会不高兴","你在朋友面前替他解释，说完自己心里空","三个月后还是这样，你想都不敢想"],"tail":"停不是分手，是先停掉「什么都围着他转」这个流程。你不需要先想好退路，才能拿回自己。"},"plan_default":"这周做一件不靠他、也不跟他报备的事","keep":"判断一个人看他的动作，判断一段关系看你变成了什么样。"}},"img":{"note":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAaQAAAJtCAYAAAB5QwTUAAEAAElEQVR42uydd5wd1Xn const app = document.getElementById('app');
const KEY = 'xlys_plan_ruler';
const HKEY = 'xlys_hist_ruler';
let S = {view:'home', idx:0, ans:[]};

function render(){
  if(S.view==='home') renderHome();
  else if(S.view==='quiz') renderQuiz();
  else renderResult();
  window.scrollTo(0,0);
}
function renderHome(){
  app.innerHTML = `<div class="screen active home">
    <span class="pill">${D.brand} · ${D.product}</span>
    <div class="h1 bold">关系里的一把尺</div>
    <div class="h2">5 题 · 2 分钟</div>
    <img class="hero" src="${D.img.note}" alt="">
    <div class="lead">
      不管你现在卡在哪件事上——<br>
      他冷了、不回消息、要走、还是说不清哪里不对——<br>
      用这<b>五个问题</b>过一遍。
    </div>
    <div class="give">
      <h5>测完你会拿到</h5>
      <ul>
        <li>一个明确的判断：还不用下结论 / 该谈一次 / 该减码了 / 已经在耗你</li>
        <li>判断依据：逐条列出你选了什么、各说明什么</li>
        <li>一个 7 天内能做的验证，带可以直接发的话</li>
        <li>一条决策线：出现什么，就该停了</li>
      </ul>
    </div>
    <div class="once"><b>一次买断，以后都能用。</b>下次再遇到拿不准的事，回来再跑一遍，它会告诉你跟上次比有没有变。</div>
    <button class="start" onclick="start()">开始测</button>
    <div class="meta">就着你正在纠结的那件事选 · 不确定的选中间项</div>
    <div class="disc">本测试只对你提供的情况做行为层面的解读，不预测未来，不构成心理或医疗建议。你的答案只保存在这台设备上，不会上传。</div>
  </div>`;
}
function start(){ S = {view:'quiz', idx:0, ans:[]}; render(); }
function renderQuiz(){
  const n = D.questions.length, q = D.questions[S.idx];
  const opts = q.o.map((o,i)=>`<button class="opt" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}</b><span>${o.t}</span></button>`).join('');
  app.innerHTML = `<div class="screen active quiz">
    <div class="top">
      <button class="back" onclick="back()">←</button>
      <span class="pnum">${S.idx+1} / ${n}</span>
      <div class="bar"><i></i></div>
    </div>
    <div class="qz">
      <div class="qq">${q.q}</div>
      <div class="qh">就着你正在纠结的那件事选</div>
      <div class="opts">${opts}</div>
    </div>
  </div>`;
  const w = app.querySelector('.bar i');
  requestAnimationFrame(()=>{ w.style.width = ((S.idx+1)/n*100)+'%'; });
}
function choose(i){
  S.ans.push(i);
  if(S.idx+1 < D.questions.length){ S.idx++; render(); }
  else { S.view='result'; render(); }
}
function back(){
  if(S.idx>0){ S.idx--; S.ans.pop(); render(); }
  else { S.view='home'; render(); }
}
function compute(){
  const dim = {};
  D.dims.forEach(d=>{ dim[d.key] = 0; });
  let total = 0;
  D.questions.forEach((q,qi)=>{
    const p = q.o[S.ans[qi]].p;
    dim[q.dim] += p; total += p;
  });
  let lvKey;
  if(total >= 11) lvKey = 'D';
  else if(total <= 6) lvKey = 'A';
  else if(S.ans[1] === 1 || S.ans[1] === 2) lvKey = 'C';
  else lvKey = 'B';
  return {total, dim, lvKey, level: D.levels[lvKey]};
}
/* 挑最有信息量的 3 条；反向证据在未引用的题里找：
   非 A 档取「最轻的一条」（唯一不支持这个判断的）；A 档取「最重的一条」 */
function evidences(lvKey){
  const items = [];
  D.questions.forEach((q,qi)=>{
    const o = q.o[S.ans[qi]];
    items.push({qi, p:o.p, t:o.t, e:o.e, dev:Math.abs(o.p-1.5)});
  });
  const sorted = items.slice().sort((a,b)=> b.dev - a.dev);
  const top = sorted.slice(0,3);
  const used = new Set(top.map(x=>x.qi));
  const rest = items.filter(it=>!used.has(it.qi));
  let pick = null;
  if(rest.length){
    if(lvKey === 'A'){ pick = rest.reduce((a,b)=> b.p > a.p ? b : a); if(pick.p < 1) pick = null; }
    else { pick = rest.reduce((a,b)=> b.p < a.p ? b : a); }
  }
  return {top, pick};
}
function renderResult(){
  const {total, dim, lvKey, level} = compute();
  const {top, pick} = evidences(lvKey);

  const dimHtml = D.dims.map(d=>{
    const pct = Math.round(dim[d.key]/d.max*100);
    return `<div class="dim">
      <div class="dn"><span>${d.name}</span><em>${d.desc}</em></div>
      <div class="dtrack"><i data-w="${pct}"></i></div>
    </div>`;
  }).join('');

  const evHtml = top.map(it=>`
    <div class="evitem">
      <div class="q">第 ${it.qi+1} 题 · 你选的是</div>
      <div class="a">「${it.t}」</div>
      <div class="m">${it.e}</div>
    </div>`).join('');
  let negHtml = '';
  if(pick){
    if(lvKey === 'A'){
      negHtml = `
    <div class="evitem neg">
      <div class="q">这几条里最该留意的 · 第 ${pick.qi+1} 题</div>
      <div class="a">「${pick.t}」</div>
      <div class="m">其他项都轻，这一条相对重一点。它现在还不构成结论，但值得记着——下次再测的时候先看它。</div>
    </div>`;
    } else {
      negHtml = `
    <div class="evitem neg">
      <div class="q">这组答案里，唯一不太支持上面判断的 · 第 ${pick.qi+1} 题</div>
      <div class="a">「${pick.t}」</div>
      <div class="m">这一条你填得轻，说明至少在这一块上，还没到那一步。所以上面的判断别当成定论，它是就着你填的这五条得出的。</div>
    </div>`;
    }
  }

  const e = level.exp;
  const rHtml = e.reacts.map(r=>`
    <div class="r"><div class="rt">${r[0]}</div><div class="rd">${r[1]}</div></div>`).join('');
  const d = level.decision;
  const dHtml = d.items.map(t=>`<li>${t}</li>`).join('');
  const seen = level.seen.map(t=>`<div class="seen"><i></i><span>${t}</span></div>`).join('');
  const closing = D.closing.map(p=>`<p>${p}</p>`).join('');

  const today = new Date().toISOString().slice(0,10);
  let oldHtml = '', histHtml = '';
  try{
    const o = JSON.parse(localStorage.getItem(KEY)||'null');
    if(o && o.do){ oldHtml = `<div class="old"><b>你上次记的：</b>${o.do}${o.when?'（'+o.when+'）':''}<br>这次测完可以对照着看，有没有变化。</div>`; }
  }catch(err){}
  try{
    const h = JSON.parse(localStorage.getItem(HKEY)||'null');
    if(h && h.lv){
      const same = h.lv === lvKey;
      histHtml = `<div class="hist">
        <h4>上 次 和 这 次</h4>
        <div class="hh">上次（${h.at}）：${h.name}${same?'<em>没有变化</em>':'<em>变了</em>'}<br>这次（${today}）：${level.name}</div>
        <div class="hd">${same ? '同一档连续两次，就不是巧合了。这一档适合照着「7 天能做的那件事」真的做一次，再回来测。' : '档位变了，说明这中间确实发生了什么。回头想想是哪一件事带动的——那就是关键。'}</div>
      </div>`;
    }
  }catch(err){}

  app.innerHTML = `<div class="screen active res">
    <span class="pill">${D.brand} · ${D.product}</span>

    <div class="share">
      <div class="sl">我 的 结 果 卡</div>
      <div class="sn">${level.name}</div>
      <div class="sk">「${level.line}」</div>
      <div class="sq">${level.keep}</div>
      <div class="sb">${D.brand} · ${D.product}</div>
    </div>
    <button class="cp2" onclick="copyShare()">复制这段去评论区</button>
    <div id="shareText" style="display:none">我测的是「关系里的一把尺 · ${D.product}」，结果是：${level.name}。${level.keep}——${D.brand}</div>

    <div class="vd">
      <div class="lab">我 的 判 断</div>
      <div class="txt">${level.verdict}</div>
      <div class="sub">${level.verdict_sub}</div>
      <div class="conf"><b>这个判断在什么情况下会变：</b>${level.confidence}</div>
    </div>

    ${histHtml}

    <img class="rimg" src="${D.img[level.img]}" width="150" alt="" style="margin:12px auto 0;display:block">

    <div class="dims">
      <h4>你 的 五 项 体 检</h4>
      <div class="hint">条越长，这一项越明显（不是越长越好）</div>
      ${dimHtml}
    </div>

    <div class="ev">
      <h4>判 断 依 据</h4>
      <div class="hint">下面这几条是你自己选的，不是我替你填的</div>
      ${evHtml}
      ${negHtml}
    </div>

    <div class="exp">
      <h4>7 天 内 可 以 做 的 一 件 事</h4>
      <div class="en">${e.name}</div>
      <div class="ew">${e.why}</div>
      <div class="sc">
        <div class="sl">可 以 直 接 发 的 话</div>
        <button class="cp" onclick="copyScript()">复制</button>
        <div class="st" id="scriptText">${e.script}</div>
      </div>
      <div class="wf">做的时候看什么：${e.watch_for}</div>
      <div class="rs">
        <div class="rl">可能出现三种情况，各说明什么</div>
        ${rHtml}
      </div>
    </div>

    <div class="dl">
      <h4>${d.head}</h4>
      <ul>${dHtml}</ul>
      <div class="dt">${d.tail}</div>
    </div>

    <div class="pc">
      <h4>你 的 行 动 卡</h4>
      <div class="ph">填完会存在这台手机上，下次打开还在。7 天后再回来看一眼。</div>
      ${oldHtml}
      <label>我决定做的一件事</label>
      <input id="pDo" value="${level.plan_default}" placeholder="写下你要做的那一件事">
      <label>我准备什么时候做</label>
      <input id="pWhen" placeholder="比如：这周三">
      <label>做完之后，我看他的什么</label>
      <textarea id="pSee" placeholder="比如：看他有没有回头问">${e.watch_for}</textarea>
      <button class="save" onclick="savePlan()">存下来</button>
      <div class="saved" id="saved"></div>
    </div>

    <div class="warm">${level.warm}</div>
    <div class="sec"><h4>这阵子，你大概也这样过</h4>${seen}</div>
    <div class="sec"><h4>更需要留意的是</h4><div class="watch">${level.watch}</div></div>

    <div class="keepcard">
      <div class="lab">一 句 可 以 带 走 的</div>
      <div class="txt">${level.keep}</div>
    </div>

    <div class="closing">${closing}<p class="sign">${D.sign}</p></div>
    <div class="disc">本测试只对已发生的行为做解读，不预测未来，不构成心理或医疗建议。最终判断权在你自己手里。单一场景不作数，两个以上一起看。如果你正处于长期的低落或焦虑状态，请寻求专业的帮助。</div>
    <div class="btns">
      <button class="btn o" onclick="home()">回到首页</button>
      <button class="btn p" onclick="again()">再测一次</button>
    </div>
  </div>`;
  try{
    localStorage.setItem(HKEY, JSON.stringify({lv:lvKey, name:level.name, at:today}));
  }catch(err){}
  requestAnimationFrame(()=>{
    document.querySelectorAll('.dtrack i').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
  });
}
function copyShare(){
  const t = document.getElementById('shareText').textContent;
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制，粘到评论区就能晒'); }
  catch(e){ toast('截上面那张卡也可以'); }
  document.body.removeChild(ta);
}
function copyScript(){
  const t = document.getElementById('scriptText').innerText;
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制，可以粘去发'); }
  catch(e){ toast('长按上面那段文字也可以复制'); }
  document.body.removeChild(ta);
}
function toast(m){
  const t = document.getElementById('toast');
  t.innerText = m; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 1900);
}
function savePlan(){
  const o = {do:document.getElementById('pDo').value,
             when:document.getElementById('pWhen').value,
             see:document.getElementById('pSee').value,
             at:new Date().toISOString().slice(0,10)};
  try{ localStorage.setItem(KEY, JSON.stringify(o)); }
  catch(e){ toast('这台设备不让保存，截图存一下吧'); return; }
  document.getElementById('saved').innerText = '存好了 · ' + o.at + '，7 天后回来对照';
}
function again(){ S = {view:'quiz', idx:0, ans:[]}; render(); }
function home(){ S = {view:'home', idx:0, ans:[]}; render(); }
render();
</script>
</body>
</html>
